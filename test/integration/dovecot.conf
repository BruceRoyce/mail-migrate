protocols = imap
listen = *
ssl = required
ssl_cert = </etc/dovecot/test.pem
ssl_key = </etc/dovecot/test.key
disable_plaintext_auth = yes
auth_mechanisms = plain login
mail_location = maildir:~/Maildir
first_valid_uid = 1000
passdb {
  driver = static
  args = password=synthetic-test-only
}
userdb {
  driver = static
  args = uid=1000 gid=1000 home=/home/synthetic
}
namespace inbox {
  inbox = yes
  separator = /
}
service imap-login {
  inet_listener imap {
    port = 0
  }
  inet_listener imaps {
    port = 993
    ssl = yes
  }
}
log_path = /dev/stderr
info_log_path = /dev/stdout
